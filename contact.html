<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Karina</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia, serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Pinyon+Script&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* See index.html's <style> for the fuller comments on the shared
     nav/mobile-menu/scroll-top pieces below — duplicated here since this
     project has no shared stylesheet. */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background-color: #000000;
    color: #FFFFFF;
    overflow-x: hidden;
  }

  body {
    font-family: 'DM Sans', sans-serif;
  }

  /* a:visited is set explicitly because browsers apply their own default
     (usually purple-ish) color to visited links regardless of the plain
     `a` rule above — without this, nav links would silently pick up a
     color accent once visited, breaking the brief's "no color accents"
     rule. */
  a,
  a:visited {
    color: #FFFFFF;
    text-decoration: none;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  /* "sr-only" pattern — see index.html's copy of this rule for the full
     comment. Used here for the skip link and each form field's <label>
     (the visible affordance is the placeholder text — see the form below —
     but a placeholder alone isn't a substitute for a real programmatic
     label, WCAG 3.3.2/4.1.2). */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Skip-to-content link (WCAG 2.4.1 Bypass Blocks). */
  .skip-link {
    position: fixed;
    top: -60px;
    left: 16px;
    z-index: 3000;
    background-color: #FFFFFF;
    color: #000000;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 20px;
    border-radius: 4px;
    transition: top 0.2s ease;
  }

  .skip-link:focus {
    top: 16px;
    outline: 2px solid #FFFFFF;
    outline-offset: 3px;
  }

  /* Focus indicators (WCAG 2.4.7). Form <input>/<textarea> fields below
     define their own focus style (a border-bottom change reads better
     there than an outline) so they're deliberately not included here. */
  a:focus-visible,
  button:focus-visible,
  [role="button"]:focus-visible {
    outline: 2px solid #FFFFFF;
    outline-offset: 3px;
  }

  /* Navigation */
  .navbar {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    padding: 2rem 1rem;
    background-color: #000000;
    z-index: 100;
  }

  .navbar a {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .navbar a:hover,
  .navbar a.active {
    opacity: 1;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 3rem;
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Mobile menu overlay. visibility:hidden by default (restored by
     .mobile-menu.open) keeps its close button and links out of the tab
     order while off-screen — see index.html's copy of this comment for
     why that matters. */
  .mobile-menu {
    position: fixed;
    inset: 0;
    background-color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    transform: translateX(100%);
    visibility: hidden;
    pointer-events: none;
    transition: transform 0.45s ease, visibility 0s linear 0.45s;
    z-index: 2000;
  }

  .mobile-menu.open {
    transform: translateX(0);
    visibility: visible;
    pointer-events: auto;
    transition: transform 0.45s ease;
  }

  .mobile-menu a {
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .mobile-menu a:hover,
  .mobile-menu a.active {
    opacity: 1;
  }

  .mobile-menu-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Page heading */
  .page-heading {
    text-align: center;
    padding: 1rem 1.5rem 1rem;
  }

  .page-heading h1 {
    font-family: 'Viaoda Libre', serif;
    font-size: clamp(2.5rem, 6vw, 3.5rem);
    font-weight: 400;
    opacity: 0;
    animation: fadeInUp 1.1s ease-out 0.1s forwards;
  }

  .page-heading p {
    font-family: 'Pinyon Script', cursive;
    font-style: italic;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    margin-top: 0.25rem;
    opacity: 0;
    animation: fadeInUp 1.1s ease-out 0.35s forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(22px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .fade-in-scroll {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .fade-in-scroll.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  /* Contact section */
  .contact-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .form-group {
    margin-bottom: 2.5rem;
  }

  /* Each field's visible <label> (see the form below) — kept in normal
     flow, above the input, rather than sr-only: the brief's placeholder-only
     look is preserved for sighted users via low-opacity styling, but a
     small always-visible label above each field is a cheap, low-visual-
     impact way to satisfy WCAG 3.3.2 without needing a screen-reader-only
     label for something this simple. */
  .form-group label {
    display: block;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 0.4rem;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid #FFFFFF;
    color: #FFFFFF;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 0.6rem 0.1rem;
    outline: none;
    transition: border-bottom-color 0.2s ease, border-bottom-width 0.2s ease;
  }

  /* Opacity raised from the original 0.45 to 0.6: at 0.45, this white-on-
     black placeholder text measured ~4.4:1 contrast — just under the 4.5:1
     WCAG AA minimum for this text size. 0.6 clears it with real margin
     (~6.3:1) while still reading as a subtle placeholder rather than full-
     strength text. */
  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: rgba(255, 255, 255, 0.6);
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-bottom-color: #FFFFFF;
    border-bottom-width: 2px;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .submit-btn {
    display: block;
    width: 100%;
    background-color: #FFFFFF;
    color: #000000;
    border: 1px solid #FFFFFF;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 1rem;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .submit-btn:hover {
    background-color: #000000;
    color: #FFFFFF;
  }

  /* Thank you message */
  .thank-you {
    text-align: center;
    padding: 2rem 0;
    font-size: 1.1rem;
    color: #FFFFFF;
    opacity: 0;
    display: none;
    transition: opacity 0.5s ease;
  }

  .thank-you.show {
    display: block;
  }

  .thank-you.visible {
    opacity: 1;
  }

  .contact-form.hidden {
    display: none;
  }

  /* Instagram link */
  .social {
    text-align: center;
    padding-bottom: 5rem;
  }

  .social a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .social a:hover {
    opacity: 1;
  }

  .social svg {
    width: 26px;
    height: 26px;
  }

  /* Scroll to top button */
  .scroll-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background-color: #FFFFFF;
    color: #000000;
    border: 1px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity 0.35s ease, transform 0.35s ease, background-color 0.25s ease, color 0.25s ease;
    z-index: 500;
  }

  .scroll-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .scroll-top:hover {
    background-color: #000000;
    color: #FFFFFF;
  }

  .scroll-top svg {
    width: 18px;
    height: 18px;
  }

  /* Responsive
     Nav collapses to the hamburger at 768px, matching index.html — this
     used to be a narrower 600px here (and on about.html/gallery.html),
     which left a 600-768px gap where .nav-links was still forced onto one
     line with no hamburger fallback, squeezing/overflowing at exactly the
     "small but not phone-sized" widths users are most likely to actually
     resize to. All four pages now agree on 768px for this; the form/
     scroll-top adjustments below are unrelated to the nav and stay at
     their own 600px breakpoint. */
  @media (max-width: 768px) {
    .navbar {
      /* Was justify-content:flex-start, which left the hamburger at the far
         left of the navbar once .nav-links disappears below this
         breakpoint. flex-end pushes it to the far right instead. */
      justify-content: flex-end;
      padding: 1.5rem 1rem;
    }

    .nav-links {
      display: none;
    }

    .hamburger {
      display: block;
    }
  }

  @media (max-width: 600px) {
    .contact-wrap {
      padding: 2rem 1.25rem 3rem;
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .scroll-top {
      bottom: 1.25rem;
      right: 1.25rem;
      width: 42px;
      height: 42px;
    }
  }

  /* Honors "reduce motion" (WCAG 2.2.2 / spirit of 2.3.3) — see index.html's
     copy of this rule for the fuller comment. */
  @media (prefers-reduced-motion: reduce) {
    .page-heading h1,
    .page-heading p {
      animation: none;
      opacity: 1;
    }

    .fade-in-scroll,
    .mobile-menu,
    .mobile-menu.open,
    .thank-you,
    .scroll-top {
      transition: none;
    }
  }
</style>
</head>
<body>

  <!-- Skip-to-content link. Must stay the first focusable element on the
       page. -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ================= NAVIGATION =================
       See index.html's copy of this comment block for the full mechanics
       of the hamburger/mobile-menu pattern. -->
  <nav class="navbar" aria-label="Primary">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active" aria-current="page">Contact</a>
    </div>
    <button type="button" class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">&#9776;</button>
  </nav>

  <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile">
    <button type="button" class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">&times;</button>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active" aria-current="page">Contact</a>
  </nav>

  <main id="main-content">

    <header class="page-heading">
      <h1>Get in Touch</h1>
      <p>Let's tell your story</p>
    </header>

    <section class="contact-wrap fade-in-scroll">
      <form class="contact-form" id="contactForm">
        <div class="form-group">
          <label for="contactName">Your Name</label>
          <input type="text" id="contactName" name="name" placeholder="Your Name" required>
        </div>
        <div class="form-group">
          <label for="contactEmail">Your Email</label>
          <input type="email" id="contactEmail" name="email" placeholder="Your Email" required>
        </div>
        <div class="form-group">
          <label for="contactMessage">Your Message</label>
          <textarea id="contactMessage" name="message" placeholder="Tell me about your day" required></textarea>
        </div>
        <button type="submit" class="submit-btn">Send Message</button>
      </form>

      <!-- role="status"/aria-live="polite": announces this text to
           screen-reader users the moment the script below reveals it,
           without needing focus to move there (WCAG 4.1.3 Status
           Messages) — otherwise a screen-reader user would have no
           indication their submission "worked" beyond the form
           disappearing. -->
      <p class="thank-you" id="thankYou" role="status" aria-live="polite">Thank you. I'll be in touch soon.<br />As a sample site, no actual message was sent.<br />Contact me @ wil@websweetweb.us</p>
    </section>

    <div class="social fade-in-scroll">
      <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram (opens in a new tab)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.5" y2="6.5"></line>
        </svg>
      </a>
    </div>

  </main>

  <button type="button" class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <script>
    // Sample site only — no backend to submit to, so this just swaps the
    // form for a "thank you" message on submit rather than making a real
    // request. See #thankYou's role="status"/aria-live in the HTML above
    // for how that swap is announced to screen readers too.
    const form = document.getElementById('contactForm');
    const thankYou = document.getElementById('thankYou');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      form.classList.add('hidden');
      thankYou.classList.add('show');
      requestAnimationFrame(() => {
        thankYou.classList.add('visible');
      });
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in-scroll').forEach((el) => revealObserver.observe(el));

    const scrollTopBtn = document.getElementById('scrollTopBtn');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('show', window.scrollY > 400);
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
    });

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuClose = document.getElementById('mobileMenuClose');

    function openMobileMenu() {
      mobileMenu.classList.add('open');
      document.body.style.overflow = 'hidden';
      hamburgerBtn.setAttribute('aria-expanded', 'true');
      mobileMenuClose.focus();
    }

    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
      hamburgerBtn.setAttribute('aria-expanded', 'false');
      hamburgerBtn.focus();
    }

    hamburgerBtn.addEventListener('click', openMobileMenu);
    mobileMenuClose.addEventListener('click', closeMobileMenu);
    mobileMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMobileMenu));

    mobileMenu.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const focusable = mobileMenu.querySelectorAll('a[href], button');
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && mobileMenu.classList.contains('open')) closeMobileMenu();
    });
  </script>

</body>
</html>

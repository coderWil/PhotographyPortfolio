<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Karina</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia, serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Pinyon+Script&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background-color: #000000;
    color: #FFFFFF;
    overflow-x: hidden;
  }

  body {
    font-family: 'DM Sans', sans-serif;
  }

  a {
    color: #FFFFFF;
    text-decoration: none;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  /* Navigation */
  .navbar {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    padding: 2rem 1rem;
    background-color: #000000;
    z-index: 100;
  }

  .navbar a {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .navbar a:hover,
  .navbar a.active {
    opacity: 1;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 3rem;
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Mobile menu overlay */
  .mobile-menu {
    position: fixed;
    inset: 0;
    background-color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    transform: translateX(100%);
    pointer-events: none;
    transition: transform 0.45s ease;
    z-index: 2000;
  }

  .mobile-menu.open {
    transform: translateX(0);
    pointer-events: auto;
  }

  .mobile-menu a {
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .mobile-menu a:hover,
  .mobile-menu a.active {
    opacity: 1;
  }

  .mobile-menu-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Page heading */
  .page-heading {
    text-align: center;
    padding: 1rem 1.5rem 1rem;
  }

  .page-heading h1 {
    font-family: 'Viaoda Libre', serif;
    font-size: clamp(2.5rem, 6vw, 3.5rem);
    font-weight: 400;
    opacity: 0;
    animation: fadeInUp 1.1s ease-out 0.1s forwards;
  }

  .page-heading p {
    font-family: 'Pinyon Script', cursive;
    font-style: italic;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    margin-top: 0.25rem;
    opacity: 0;
    animation: fadeInUp 1.1s ease-out 0.35s forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(22px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .fade-in-scroll {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .fade-in-scroll.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  /* Contact section */
  .contact-wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 3rem 1.5rem 5rem;
  }

  .form-group {
    margin-bottom: 2.5rem;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    background: none;
    border: none;
    border-bottom: 1px solid #FFFFFF;
    color: #FFFFFF;
    font-family: 'DM Sans', sans-serif;
    font-size: 1rem;
    padding: 0.6rem 0.1rem;
    outline: none;
    transition: border-bottom-color 0.2s ease, border-bottom-width 0.2s ease;
  }

  .form-group input::placeholder,
  .form-group textarea::placeholder {
    color: rgba(255, 255, 255, 0.45);
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-bottom-color: #FFFFFF;
    border-bottom-width: 2px;
  }

  .form-group textarea {
    resize: vertical;
    min-height: 100px;
  }

  .submit-btn {
    display: block;
    width: 100%;
    background-color: #FFFFFF;
    color: #000000;
    border: 1px solid #FFFFFF;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 1rem;
    cursor: pointer;
    transition: background-color 0.25s ease, color 0.25s ease;
  }

  .submit-btn:hover {
    background-color: #000000;
    color: #FFFFFF;
  }

  /* Thank you message */
  .thank-you {
    text-align: center;
    padding: 2rem 0;
    font-size: 1.1rem;
    color: #FFFFFF;
    opacity: 0;
    display: none;
    transition: opacity 0.5s ease;
  }

  .thank-you.show {
    display: block;
  }

  .thank-you.visible {
    opacity: 1;
  }

  .contact-form.hidden {
    display: none;
  }

  /* Instagram link */
  .social {
    text-align: center;
    padding-bottom: 5rem;
  }

  .social a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .social a:hover {
    opacity: 1;
  }

  .social svg {
    width: 26px;
    height: 26px;
  }

  /* Scroll to top button */
  .scroll-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background-color: #FFFFFF;
    color: #000000;
    border: 1px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity 0.35s ease, transform 0.35s ease, background-color 0.25s ease, color 0.25s ease;
    z-index: 500;
  }

  .scroll-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .scroll-top:hover {
    background-color: #000000;
    color: #FFFFFF;
  }

  .scroll-top svg {
    width: 18px;
    height: 18px;
  }

  /* Responsive */
  @media (max-width: 600px) {
    .navbar {
      justify-content: flex-start;
      padding: 1.5rem 1rem;
    }

    .nav-links {
      display: none;
    }

    .hamburger {
      display: block;
    }

    .contact-wrap {
      padding: 2rem 1.25rem 3rem;
    }

    .form-group {
      margin-bottom: 2rem;
    }

    .scroll-top {
      bottom: 1.25rem;
      right: 1.25rem;
      width: 42px;
      height: 42px;
    }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">&#9776;</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">&times;</button>
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html" class="active">Contact</a>
  </div>

  <header class="page-heading">
    <h1>Get in Touch</h1>
    <p>Let's tell your story</p>
  </header>

  <section class="contact-wrap fade-in-scroll">
    <form class="contact-form" id="contactForm">
      <div class="form-group">
        <input type="text" name="name" placeholder="Your Name" required>
      </div>
      <div class="form-group">
        <input type="email" name="email" placeholder="Your Email" required>
      </div>
      <div class="form-group">
        <textarea name="message" placeholder="Tell me about your day" required></textarea>
      </div>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>

    <p class="thank-you" id="thankYou">Thank you. I'll be in touch soon.<br />As a sample site, no actual message was sent.<br />Contact me @ wil@websweetweb.us</p>
  </section>

  <div class="social fade-in-scroll">
    <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.5" y2="6.5"></line>
      </svg>
    </a>
  </div>

  <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <script>
    const form = document.getElementById('contactForm');
    const thankYou = document.getElementById('thankYou');

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      form.classList.add('hidden');
      thankYou.classList.add('show');
      requestAnimationFrame(() => {
        thankYou.classList.add('visible');
      });
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in-scroll').forEach((el) => revealObserver.observe(el));

    const scrollTopBtn = document.getElementById('scrollTopBtn');

    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('show', window.scrollY > 400);
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuClose = document.getElementById('mobileMenuClose');

    function openMobileMenu() {
      mobileMenu.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
    }

    hamburgerBtn.addEventListener('click', openMobileMenu);
    mobileMenuClose.addEventListener('click', closeMobileMenu);
    mobileMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMobileMenu));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMobileMenu();
    });
  </script>

</body>
</html>

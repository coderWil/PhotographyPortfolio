<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karina</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia, serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Pinyon+Script&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    background-color: #000000;
    color: #FFFFFF;
    overflow-x: hidden;
  }

  body {
    font-family: 'DM Sans', sans-serif;
  }

  a {
    color: #FFFFFF;
    text-decoration: none;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  /* Navigation */
  .navbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    padding: 2rem 1rem;
    z-index: 10;
  }

  .navbar a {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .navbar a:hover,
  .navbar a.active {
    opacity: 1;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 3rem;
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Mobile menu overlay */
  .mobile-menu {
    position: fixed;
    inset: 0;
    background-color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    transform: translateX(100%);
    pointer-events: none;
    transition: transform 0.45s ease;
    z-index: 2000;
  }

  .mobile-menu.open {
    transform: translateX(0);
    pointer-events: auto;
  }

  .mobile-menu a {
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .mobile-menu a:hover,
  .mobile-menu a.active {
    opacity: 1;
  }

  .mobile-menu-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Hero */
  .hero {
    position: relative;
    height: 100vh;
    height: 100svh;
    width: 100%;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background-image: url('images/hero-placeholder.jpg');
    background-size: cover;
    background-position: center;
    filter: grayscale(100%);
    overflow: hidden;
  }

  .hero-overlay {
    position: absolute;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.55);
  }

  .hero-content {
    position: relative;
    z-index: 2;
    padding: 1rem;
    filter: none;
  }

  .hero-name {
    font-family: 'Viaoda Libre', serif;
    font-size: clamp(3rem, 10vw, 6rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    opacity: 0;
    animation: fadeInUp 1.2s ease-out 0.2s forwards;
  }

  .hero-tagline {
    font-family: 'Pinyon Script', cursive;
    font-style: italic;
    font-size: clamp(1.5rem, 5vw, 2.5rem);
    margin-top: 0.5rem;
    opacity: 0;
    animation: fadeInUp 1.2s ease-out 0.55s forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(22px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .fade-in-scroll {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.9s ease, transform 0.9s ease;
  }

  .fade-in-scroll.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  /* Intro */
  .intro {
    max-width: 700px;
    margin: 0 auto;
    padding: 6rem 1.5rem 4rem;
    text-align: center;
  }

  .intro p {
    font-size: 1rem;
    line-height: 1.8;
    color: #E5E5E5;
  }

  /* Gallery Preview */
  .gallery-preview {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 1.5rem 6rem;
  }

  .gallery-preview .thumb {
    aspect-ratio: 4 / 5;
    background-color: #1a1a1a;
    background-size: cover;
    background-position: center;
    filter: grayscale(100%);
    transition: filter 0.3s ease, transform 0.3s ease;
  }

  .gallery-preview .thumb:hover {
    filter: grayscale(60%);
    transform: scale(1.02);
  }

  .gallery-preview .thumb.fade-in-scroll {
    transition: opacity 0.9s ease, transform 0.4s ease, filter 0.3s ease;
  }

  .gallery-preview .thumb.fade-in-scroll:nth-child(2) { transition-delay: 0.1s; }
  .gallery-preview .thumb.fade-in-scroll:nth-child(3) { transition-delay: 0.2s; }

  .thumb:nth-child(1) { background-image: url('images/gallery-1.jpg'); }
  .thumb:nth-child(2) { background-image: url('images/gallery-2.jpg'); }
  .thumb:nth-child(3) { background-image: url('images/gallery-3.jpg'); }

  /* Scroll to top button */
  .scroll-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background-color: #FFFFFF;
    color: #000000;
    border: 1px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity 0.35s ease, transform 0.35s ease, background-color 0.25s ease, color 0.25s ease;
    z-index: 500;
  }

  .scroll-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .scroll-top:hover {
    background-color: #000000;
    color: #FFFFFF;
  }

  .scroll-top svg {
    width: 18px;
    height: 18px;
  }

  /* Responsive */
  @media (max-width: 768px) {
    .navbar {
      justify-content: flex-start;
      padding: 1.5rem 1rem;
    }

    .nav-links {
      display: none;
    }

    .hamburger {
      display: block;
    }

    .gallery-preview {
      grid-template-columns: 1fr;
    }

    .scroll-top {
      bottom: 1.25rem;
      right: 1.25rem;
      width: 42px;
      height: 42px;
    }
  }
</style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-links">
      <a href="#home" class="active">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <button class="hamburger" id="hamburgerBtn" aria-label="Open menu">&#9776;</button>
  </nav>

  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">&times;</button>
    <a href="#home" class="active">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </div>

  <section class="hero" id="home">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-name">Karina</h1>
      <p class="hero-tagline">Capturing Love Stories</p>
    </div>
  </section>

  <section class="intro fade-in-scroll">
    <p>
      I'm Karina, a wedding photographer devoted to telling the quiet, honest
      moments of your day — the glances, the laughter, the stillness between
      vows. Every story deserves to be remembered exactly as it felt.
    </p>
  </section>

  <section class="gallery-preview" id="gallery">
    <div class="thumb fade-in-scroll"></div>
    <div class="thumb fade-in-scroll"></div>
    <div class="thumb fade-in-scroll"></div>
  </section>

  <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <script>
    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });

    document.querySelectorAll('.fade-in-scroll').forEach((el) => revealObserver.observe(el));

    const scrollTopBtn = document.getElementById('scrollTopBtn');

    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('show', window.scrollY > 400);
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuClose = document.getElementById('mobileMenuClose');

    function openMobileMenu() {
      mobileMenu.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
    }

    hamburgerBtn.addEventListener('click', openMobileMenu);
    mobileMenuClose.addEventListener('click', closeMobileMenu);
    mobileMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMobileMenu));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMobileMenu();
    });
  </script>

</body>
</html>

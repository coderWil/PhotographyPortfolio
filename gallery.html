<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery — Karina</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='black'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Georgia, serif' font-weight='700' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Viaoda+Libre&family=Pinyon+Script&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* See index.html's <style> for the fuller comments on the shared
     nav/mobile-menu/scroll-top pieces below — duplicated here since this
     project has no shared stylesheet. */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    background-color: #000000;
    color: #FFFFFF;
    overflow-x: hidden;
  }

  body {
    font-family: 'DM Sans', sans-serif;
  }

  /* a:visited is set explicitly because browsers apply their own default
     (usually purple-ish) color to visited links regardless of the plain
     `a` rule above — without this, nav links would silently pick up a
     color accent once visited, breaking the brief's "no color accents"
     rule. */
  a,
  a:visited {
    color: #FFFFFF;
    text-decoration: none;
  }

  img {
    max-width: 100%;
    height: auto;
    display: block;
  }

  /* "sr-only" pattern — see index.html's copy of this rule for the full
     comment. Used here for the skip link. */
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* Skip-to-content link (WCAG 2.4.1 Bypass Blocks). */
  .skip-link {
    position: fixed;
    top: -60px;
    left: 16px;
    z-index: 3000;
    background-color: #FFFFFF;
    color: #000000;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 12px 20px;
    border-radius: 4px;
    transition: top 0.2s ease;
  }

  .skip-link:focus {
    top: 16px;
    outline: 2px solid #FFFFFF;
    outline-offset: 3px;
  }

  /* Focus indicators (WCAG 2.4.7) — [role="button"] here also covers each
     .gallery-item once it's promoted to a keyboard-operable button role by
     the script below. */
  a:focus-visible,
  button:focus-visible,
  [role="button"]:focus-visible {
    outline: 2px solid #FFFFFF;
    outline-offset: 3px;
  }

  /* Navigation */
  .navbar {
    position: sticky;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3rem;
    padding: 2rem 1rem;
    background-color: #000000;
    z-index: 100;
  }

  .navbar a {
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .navbar a:hover,
  .navbar a.active {
    opacity: 1;
  }

  .nav-links {
    display: flex;
    align-items: center;
    gap: 3rem;
  }

  .hamburger {
    display: none;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 1.6rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Mobile menu overlay. visibility:hidden by default (restored by
     .mobile-menu.open) keeps its close button and links out of the tab
     order while off-screen — see index.html's copy of this comment for
     why that matters. */
  .mobile-menu {
    position: fixed;
    inset: 0;
    background-color: #000000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
    transform: translateX(100%);
    visibility: hidden;
    pointer-events: none;
    transition: transform 0.45s ease, visibility 0s linear 0.45s;
    z-index: 2000;
  }

  .mobile-menu.open {
    transform: translateX(0);
    visibility: visible;
    pointer-events: auto;
    transition: transform 0.45s ease;
  }

  .mobile-menu a {
    font-size: 1.2rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .mobile-menu a:hover,
  .mobile-menu a.active {
    opacity: 1;
  }

  .mobile-menu-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: none;
    border: none;
    color: #FFFFFF;
    font-size: 2rem;
    line-height: 1;
    cursor: pointer;
  }

  /* Page heading */
  .page-heading {
    text-align: center;
    padding: 1rem 1.5rem 3rem;
  }

  .page-heading h1 {
    font-family: 'Viaoda Libre', serif;
    font-size: clamp(2.5rem, 6vw, 3.5rem);
    font-weight: 400;
    opacity: 0;
    animation: fadeInUp 1.1s ease-out 0.1s forwards;
  }

  .page-heading p {
    font-family: 'Pinyon Script', cursive;
    font-style: italic;
    font-size: clamp(1.3rem, 4vw, 1.8rem);
    margin-top: 0.25rem;
    opacity: 0;
    animation: fadeInUp 1.1s ease-out 0.35s forwards;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(22px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .fade-in-scroll {
    opacity: 0;
    transform: translateY(24px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }

  .fade-in-scroll.in-view {
    opacity: 1;
    transform: translateY(0);
  }

  /* Masonry Gallery */
  .gallery {
    column-count: 3;
    column-gap: 1rem;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 1.5rem 5rem;
  }

  /* Each .gallery-item is promoted to role="button"/tabindex="0" by the
     script below (see its comment for the full reasoning) so it needs to
     look interactive/focusable like a real button, not just a static
     thumbnail. */
  .gallery-item {
    break-inside: avoid;
    margin-bottom: 1rem;
    overflow: hidden;
    cursor: pointer;
  }

  .gallery-item img {
    display: block;
    width: 100%;
    height: auto;
    filter: grayscale(100%);
    transition: filter 0.3s ease, transform 0.4s ease;
  }

  .gallery-item:hover img {
    filter: grayscale(60%);
    transform: scale(1.03);
  }

  /* Lightbox
     opacity/visibility (not just opacity) means this is already correctly
     removed from the tab order while closed, unlike .mobile-menu, which
     needed a fix for the same underlying issue — see that comment on
     index.html for the full explanation of why visibility matters here. */
  .lightbox {
    position: fixed;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.92);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.35s ease;
    z-index: 1000;
  }

  .lightbox.active {
    opacity: 1;
    visibility: visible;
  }

  .lightbox-img {
    max-width: 85vw;
    max-height: 85vh;
    filter: grayscale(100%);
    opacity: 0;
    transform: scale(0.97);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .lightbox-img.show {
    opacity: 1;
    transform: scale(1);
  }

  .lightbox-close,
  .lightbox-arrow {
    position: absolute;
    background: none;
    border: none;
    color: #FFFFFF;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    opacity: 0.85;
    transition: opacity 0.2s ease;
  }

  .lightbox-close:hover,
  .lightbox-arrow:hover {
    opacity: 1;
  }

  .lightbox-close {
    top: 1.5rem;
    right: 1.5rem;
    font-size: 2rem;
    line-height: 1;
  }

  .lightbox-arrow {
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.5rem;
    padding: 0.5rem 1rem;
  }

  .lightbox-arrow.prev {
    left: 0.5rem;
  }

  .lightbox-arrow.next {
    right: 0.5rem;
  }

  /* Scroll to top button */
  .scroll-top {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background-color: #FFFFFF;
    color: #000000;
    border: 1px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(12px);
    transition: opacity 0.35s ease, transform 0.35s ease, background-color 0.25s ease, color 0.25s ease;
    z-index: 500;
  }

  .scroll-top.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .scroll-top:hover {
    background-color: #000000;
    color: #FFFFFF;
  }

  .scroll-top svg {
    width: 18px;
    height: 18px;
  }

  /* Responsive */
  @media (max-width: 900px) {
    .gallery {
      column-count: 2;
    }
  }

  @media (max-width: 600px) {
    .navbar {
      /* Was justify-content:flex-start, which left the hamburger at the far
         *left* of the navbar once .nav-links disappears below this
         breakpoint. flex-end pushes it to the far right instead. */
      justify-content: flex-end;
      padding: 1.5rem 1rem;
    }

    .nav-links {
      display: none;
    }

    .hamburger {
      display: block;
    }

    .gallery {
      column-count: 1;
    }

    .lightbox-arrow {
      font-size: 1.8rem;
      padding: 0.5rem 0.75rem;
    }

    .lightbox-close {
      font-size: 1.6rem;
      top: 1rem;
      right: 1rem;
    }

    .scroll-top {
      bottom: 1.25rem;
      right: 1.25rem;
      width: 42px;
      height: 42px;
    }
  }

  /* Honors "reduce motion" (WCAG 2.2.2 / spirit of 2.3.3) — see index.html's
     copy of this rule for the fuller comment. */
  @media (prefers-reduced-motion: reduce) {
    .page-heading h1,
    .page-heading p {
      animation: none;
      opacity: 1;
    }

    .fade-in-scroll,
    .mobile-menu,
    .mobile-menu.open,
    .lightbox,
    .lightbox-img,
    .scroll-top {
      transition: none;
    }
  }
</style>
</head>
<body>

  <!-- Skip-to-content link. Must stay the first focusable element on the
       page. -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- ================= NAVIGATION =================
       See index.html's copy of this comment block for the full mechanics
       of the hamburger/mobile-menu pattern. -->
  <nav class="navbar" aria-label="Primary">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="gallery.html" class="active" aria-current="page">Gallery</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </div>
    <button type="button" class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mobileMenu">&#9776;</button>
  </nav>

  <nav class="mobile-menu" id="mobileMenu" aria-label="Mobile">
    <button type="button" class="mobile-menu-close" id="mobileMenuClose" aria-label="Close menu">&times;</button>
    <a href="index.html">Home</a>
    <a href="gallery.html" class="active" aria-current="page">Gallery</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main id="main-content">

    <header class="page-heading">
      <h1>Gallery</h1>
      <p>Moments, held still</p>
    </header>

    <!-- Populated by the script below — see its comment for how each
         .gallery-item is built and made keyboard-operable. -->
    <section class="gallery" id="gallery" aria-label="Wedding photo gallery">
      <!-- gallery items injected by script -->
    </section>

  </main>

  <!-- role="dialog"/aria-modal="true": tells assistive tech this is a
       self-contained overlay that takes over the page while open —
       without it, a screen reader has no way to know the rest of the page
       is temporarily inert behind it. aria-label names the dialog since it
       has no visible heading of its own. See the script below for the
       focus management (focus moves in on open, back to the triggering
       thumbnail on close) and the focus trap. -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
    <button type="button" class="lightbox-arrow prev" id="lightboxPrev" aria-label="Previous">&#8249;</button>
    <img class="lightbox-img" id="lightboxImg" src="" alt="Enlarged gallery photo">
    <button type="button" class="lightbox-arrow next" id="lightboxNext" aria-label="Next">&#8250;</button>
  </div>

  <button type="button" class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
      <line x1="12" y1="19" x2="12" y2="5"></line>
      <polyline points="5 12 12 5 19 12"></polyline>
    </svg>
  </button>

  <script>
    // Adjustable: one entry per photo, height in px — controls how tall
    // each masonry column item renders (picsum.photos crops/generates the
    // placeholder image to match). Add/remove entries to change the photo
    // count; edit a value to change that photo's aspect ratio in the grid.
    const heights = [520, 640, 460, 600, 560, 700, 480, 610, 540, 590, 470, 650];
    const gallery = document.getElementById('gallery');
    const photos = heights.map((h, i) => ({
      thumb: `https://picsum.photos/seed/karina-${i + 1}/500/${h}`,
      full: `https://picsum.photos/seed/karina-${i + 1}/1400/${Math.round(h * 2.2)}`
    }));

    // Builds one .gallery-item per photo. Each is promoted to
    // role="button"/tabindex="0" with its own keydown handler (Enter/Space)
    // — the original version only opened the lightbox on a mouse/touch
    // click of a plain, non-focusable <div>, so a keyboard-only user could
    // not open a single photo at all (WCAG 2.1.1 Keyboard). The inner <img>
    // gets alt="" (decorative) since the button's own aria-label already
    // gives it a full accessible name describing the same photo — without
    // that, a screen reader would announce the photo twice.
    photos.forEach((photo, index) => {
      const item = document.createElement('div');
      item.className = 'gallery-item fade-in-scroll';
      item.style.transitionDelay = `${(index % 3) * 0.1}s`;
      item.dataset.index = index;
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');
      item.setAttribute('aria-label', `Open wedding photo ${index + 1} in full size`);

      const img = document.createElement('img');
      img.src = photo.thumb;
      img.alt = '';
      img.loading = 'lazy';

      item.appendChild(img);
      item.addEventListener('click', () => openLightbox(index, item));
      item.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault(); // stops Space from also scrolling the page
          openLightbox(index, item);
        }
      });
      gallery.appendChild(item);
    });

    const revealObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('in-view');
          revealObserver.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });

    document.querySelectorAll('.fade-in-scroll').forEach((el) => revealObserver.observe(el));

    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');
    const closeBtn = document.getElementById('lightboxClose');
    const prevBtn = document.getElementById('lightboxPrev');
    const nextBtn = document.getElementById('lightboxNext');
    let currentIndex = 0;
    // The .gallery-item that was activated to open the lightbox, so focus
    // can return to exactly that thumbnail on close (WCAG 2.4.3) rather
    // than being dropped back at the top of the page.
    let lightboxTrigger = null;

    function showImage(index) {
      lightboxImg.classList.remove('show');
      setTimeout(() => {
        lightboxImg.src = photos[index].full;
        lightboxImg.alt = `Wedding photo ${index + 1} enlarged`;
        lightboxImg.classList.add('show');
      }, 150);
    }

    function openLightbox(index, triggerEl) {
      currentIndex = index;
      lightboxTrigger = triggerEl || null;
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
      showImage(currentIndex);
      closeBtn.focus();
    }

    function closeLightbox() {
      lightbox.classList.remove('active');
      lightboxImg.classList.remove('show');
      document.body.style.overflow = '';
      if (lightboxTrigger) lightboxTrigger.focus();
    }

    function showPrev() {
      currentIndex = (currentIndex - 1 + photos.length) % photos.length;
      showImage(currentIndex);
    }

    function showNext() {
      currentIndex = (currentIndex + 1) % photos.length;
      showImage(currentIndex);
    }

    closeBtn.addEventListener('click', closeLightbox);
    prevBtn.addEventListener('click', showPrev);
    nextBtn.addEventListener('click', showNext);

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // Basic focus trap: while the lightbox is open, Tab/Shift+Tab cycles
    // through just its own three buttons instead of escaping into the
    // (visually hidden-behind-it, but otherwise still-present) gallery
    // grid below.
    lightbox.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const focusable = [closeBtn, prevBtn, nextBtn];
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    const scrollTopBtn = document.getElementById('scrollTopBtn');
    const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    window.addEventListener('scroll', () => {
      scrollTopBtn.classList.toggle('show', window.scrollY > 400);
    });

    scrollTopBtn.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: prefersReducedMotion ? 'auto' : 'smooth' });
    });

    const hamburgerBtn = document.getElementById('hamburgerBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    const mobileMenuClose = document.getElementById('mobileMenuClose');

    function openMobileMenu() {
      mobileMenu.classList.add('open');
      document.body.style.overflow = 'hidden';
      hamburgerBtn.setAttribute('aria-expanded', 'true');
      mobileMenuClose.focus();
    }

    function closeMobileMenu() {
      mobileMenu.classList.remove('open');
      document.body.style.overflow = '';
      hamburgerBtn.setAttribute('aria-expanded', 'false');
      hamburgerBtn.focus();
    }

    hamburgerBtn.addEventListener('click', openMobileMenu);
    mobileMenuClose.addEventListener('click', closeMobileMenu);
    mobileMenu.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMobileMenu));

    mobileMenu.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const focusable = mobileMenu.querySelectorAll('a[href], button');
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    // Both overlays share one Escape handler; only one is ever realistically
    // open at a time, but each is checked independently so neither path
    // interferes with the other.
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape') return;
      if (lightbox.classList.contains('active')) closeLightbox();
      if (mobileMenu.classList.contains('open')) closeMobileMenu();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'ArrowLeft') showPrev();
      if (e.key === 'ArrowRight') showNext();
    });
  </script>

</body>
</html>
